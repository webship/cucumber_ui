include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - "/includes/include.drupalci.main.yml"
      - "/includes/include.drupalci.variables.yml"
      - "/includes/include.drupalci.workflows.yml"

variables:
  # No yarn.lock is committed; Yarn 4 defaults to immutable installs and would
  # refuse to create one. Allow lockfile creation in CI for every job.
  YARN_ENABLE_IMMUTABLE_INSTALLS: "false"

.composer-base:
  variables:
    # Drupal core's own Yarn 4.9.1 would read the project .yarnrc.yml (Yarn >= 4.14 keys) too.
    YARN_RC_FILENAME: .yarnrc.core.yml
    YARN_NODE_LINKER: node-modules

cspell:
  stage: validate
  image: node:24
  before_script:
    - npm install -g cspell
  script:
    - cspell "**/*.{php,module,inc,install,test,profile,theme,js,css,md,yml,txt}" --no-progress || true
  allow_failure: true

# Shared setup for the fast lint jobs (eslint, stylelint).
#
# Three things keep these jobs quick:
#   1. `dependencies: []` — the lint jobs do NOT need the composer job's build
#      artifact (the full Drupal tree). Skipping it avoids downloading and then
#      walking thousands of vendor/ files, which was the main slowdown.
#   2. `yarn install --mode=skip-build` — skips every package's build/postinstall
#      step (eslint/stylelint need none, and it avoids webship-js's postinstall
#      pulling the Playwright browsers). Install drops to ~10s.
#   3. package.json-keyed cache of `.yarn/cache` so later pipelines reuse packages.
# The paired .eslintignore excludes vendor/, .yarn/, web/ and node_modules/ so
# `eslint .` only lints real module source.
.lint-yarn:
  image: node:24
  dependencies: []
  variables:
    YARN_ENABLE_GLOBAL_CACHE: "false"
  cache:
    key:
      files:
        - package.json
    paths:
      - .yarn/cache
  before_script:
    - corepack enable
    - yarn install --mode=skip-build

eslint:
  extends: .lint-yarn
  stage: validate
  script:
    - yarn lint:js
    - yarn lint:yaml
  after_script:
    - touch junit.xml _eslint.patch
  allow_failure: false

stylelint:
  extends: .lint-yarn
  stage: validate
  script:
    - yarn lint:css || true
  after_script:
    - echo '[]' > gl-codequality.json
  allow_failure: true

# Shared Drupal + Node.js setup for browser tests.
#
# How it works:
#   1. The drupalci `composer` job builds a full Drupal site (cucumber_ui plus
#      its dependencies) and passes its artifact to this job via
#      `needs: [composer]`.
#   2. This job runs inside the drupalci PHP-Apache image (inherited from
#      `.testing-job-base`) which already has PHP, Apache, Drush, and MySQL.
#   3. before_script installs Drupal + the module, then Node.js + yarn deps +
#      Playwright Chromium. Test jobs only override `script:`.
#   4. Per-role test users are provisioned by the first suite scenario, so
#      drush only installs Drupal with the Webmaster super-admin account.
# ------------------------------------------------------------------------------
.drupal-node-base:
  extends: .testing-job-base
  needs: [composer]
  # Override the parent's services. We only need the database. Playwright
  # bundles its own Chromium, so Selenium and chromedriver are not needed.
  services:
    - name: $_CONFIG_DOCKERHUB_ROOT/$_TARGET_DB_TYPE-$_TARGET_DB_VERSION:$_TARGET_DB_IMAGE_TAG
      alias: database
  variables:
    DRUPAL_ADMIN_USERNAME: "webmaster"
    DRUPAL_ADMIN_PASSWORD: "dD.123123ddd"
    DRUPAL_TEST_BASE_URL: "http://localhost"
    LAUNCH_URL: "http://localhost"
    FORCE_COLOR: "1"
  before_script:
    # Web server.
    - mkdir -pv $CI_PROJECT_DIR/$_WEB_ROOT/sites/default/files
    - mkdir -pv $CI_PROJECT_DIR/$_WEB_ROOT/sites/simpletest
    - chmod -R 777 $CI_PROJECT_DIR/$_WEB_ROOT/sites/default/files
    - chmod -R 777 $CI_PROJECT_DIR/$_WEB_ROOT/sites/simpletest
    - rm -rf /var/www/html && ln -s $CI_PROJECT_DIR/$_WEB_ROOT /var/www/html
    - chown -R www-data:www-data $CI_PROJECT_DIR
    - service apache2 start
    # Database.
    - export SIMPLETEST_DB=mysql://$MYSQL_USER:$MYSQL_PASSWORD@database/$MYSQL_DATABASE
    # Drupal site install.
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT site:install standard
        --db-url=$SIMPLETEST_DB
        --account-name=webmaster
        --account-pass=dD.123123ddd
        --site-name="Cucumber UI Test"
        -y
    # Module install.
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT en cucumber_ui -y
    # Serve every library file separately so the asset scenarios can assert
    # the Cucumber UI CSS and JS by file name instead of an aggregate.
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT config:set system.performance css.preprocess 0 -y
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT config:set system.performance js.preprocess 0 -y
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT cache:rebuild
    # The Update Manager can show "There is a security update available for your version of Drupal" as an
    # error message on admin pages, and the step pack's `I add the testing users` reads any error message
    # after the submit as a failed account creation. The suite does not use the Update Manager.
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT pm:uninstall update -y
    # Per-role test users are provisioned by the first scenario in the suite
    # (01-01-01-users-login.feature, "Webmaster can log in and provision
    # testing users"), so no separate drush step is needed here.
    # Node.js 24.
    - curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
    - apt-get install -y nodejs
    - node --version && npm --version
    # Yarn deps + Playwright Chromium.
    # Force node_modules layout so node_modules/.bin/* is populated.
    - 'test -f .yarnrc.yml || echo "nodeLinker: node-modules" > .yarnrc.yml'
    # Back up cucumber.js. webship-js's postinstall can clobber it under yarn 4
    # because INIT_CWD may differ from our project root inside the container.
    - cp cucumber.js .cucumber.js.bak
    - corepack enable
    - yarn install
    # Restore cucumber.js if postinstall overwrote it with the init-webship template.
    - cp .cucumber.js.bak cucumber.js && rm .cucumber.js.bak
    - ./node_modules/.bin/playwright install --with-deps chromium

# webship-js BDD functional tests.
webship-js-test:
  extends: .drupal-node-base
  script:
    - ./node_modules/.bin/cucumber-js --config cucumber.js --dry-run
    - ./node_modules/.bin/cucumber-js --config cucumber.js --tags "not @wip"
  artifacts:
    when: always
    paths:
      - tests/reports/
      - tests/screenshots/
      - tests/videos/
    expire_in: 7 days
    reports:
      junit: tests/reports/junit.xml
  allow_failure: false
